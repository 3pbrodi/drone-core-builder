name: Verify DroneCores feature branch

on:
  push:
    branches:
      - feature/shared-drone-configurator
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build
