name: Verify Catalogue Phase E

permissions:
  contents: write

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dronecores_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dronecores_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Phase E files
        run: >-
          bunx prettier --write
          src/lib/build-data.ts
          src/lib/build-calculations.ts
          src/lib/catalogue-evidence.ts
          src/lib/catalogue-database.server.ts
          src/lib/catalogue-parity.ts
          src/lib/catalogue-import.ts
          src/lib/catalogue-evidence-import.ts
          src/lib/static-catalogue-evidence.ts
          scripts/export-static-catalogue.ts
          tests/catalogue-evidence-import.test.ts
          tests/camera-receiver-compatibility.test.ts
          tests/static-catalogue-evidence.test.ts

      - name: Full focused catalogue and compatibility tests
        run: >-
          bun test
          tests/catalogue-quality.test.ts
          tests/catalogue-evidence.test.ts
          tests/catalogue-evidence-import.test.ts
          tests/static-catalogue-evidence.test.ts
          tests/camera-receiver-compatibility.test.ts
          tests/build-calculations.test.ts

      - name: Targeted lint
        run: >-
          bunx eslint
          src/lib/catalogue-evidence.ts
          src/lib/catalogue-database.server.ts
          src/lib/catalogue-parity.ts
          src/lib/catalogue-import.ts
          src/lib/catalogue-evidence-import.ts
          src/lib/static-catalogue-evidence.ts
          tests/catalogue-evidence-import.test.ts
          tests/camera-receiver-compatibility.test.ts
          tests/static-catalogue-evidence.test.ts

      - name: Type check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Validate static catalogue export
        run: |
          bun run catalogue:export-static > /tmp/dronecores-static.csv
          test "$(wc -l < /tmp/dronecores-static.csv)" -eq 21

      - name: Validate Phase A-E migrations on local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL

          for migration in             supabase/migrations/20260927190000_catalogue_phase2.sql             supabase/migrations/20260928210000_catalogue_evidence_phase_b.sql             supabase/migrations/20260928220000_catalogue_import_phase_c.sql             supabase/migrations/20260928230000_camera_receiver_phase_e.sql
          do
            psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.catalogue_products (
            id,
            model,
            display_name,
            category,
            identity_status,
            verification_status
          ) values
            ('camera-test','Camera Test','Camera Test','camera','verified','verified'),
            ('receiver-test','Receiver Test','Receiver Test','receiver','verified','verified'),
            ('fc-test','FC Test','FC Test','flightController','verified','verified');

          insert into public.catalogue_product_specs (
            product_id,
            camera_video_interface,
            camera_min_voltage_v,
            camera_max_voltage_v,
            camera_width_mm,
            camera_height_mm,
            camera_depth_mm
          ) values (
            'camera-test','analog',5,36,19,19,19
          );

          insert into public.catalogue_product_specs (
            product_id,
            receiver_protocol,
            receiver_frequency_min_mhz,
            receiver_frequency_max_mhz,
            receiver_min_voltage_v,
            receiver_max_voltage_v,
            receiver_signal_interface,
            receiver_width_mm,
            receiver_height_mm,
            receiver_depth_mm
          ) values (
            'receiver-test','TBS Crossfire',868,915,3.3,8.4,'CRSF',18,11,11
          );

          insert into public.catalogue_product_specs (
            product_id,
            fc_camera_video_interfaces,
            fc_camera_power_voltages_v,
            fc_receiver_signal_interfaces,
            fc_receiver_power_voltages_v
          ) values (
            'fc-test',
            array['analog'],
            array[5.0]::numeric[],
            array['CRSF'],
            array[5.0]::numeric[]
          );

          select camera_video_interface, camera_min_voltage_v, camera_max_voltage_v
          from public.catalogue_product_specs
          where product_id = 'camera-test';

          select receiver_protocol, receiver_signal_interface
          from public.catalogue_product_specs
          where product_id = 'receiver-test';
          SQL

      - name: Route smoke test
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/create-custom-build >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=template&template=racer" >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=ai&budget=1200&priorities=footage,range" >/dev/null
          curl -fsS http://127.0.0.1:8080/templates >/dev/null
          curl -fsS http://127.0.0.1:8080/ai-build >/dev/null

      - name: Commit targeted formatting
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/lib/build-data.ts             src/lib/build-calculations.ts             src/lib/catalogue-evidence.ts             src/lib/catalogue-database.server.ts             src/lib/catalogue-parity.ts             src/lib/catalogue-import.ts             src/lib/catalogue-evidence-import.ts             src/lib/static-catalogue-evidence.ts             scripts/export-static-catalogue.ts             tests/catalogue-evidence-import.test.ts             tests/camera-receiver-compatibility.test.ts             tests/static-catalogue-evidence.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Phase E catalogue files [skip ci]"
            git push origin HEAD:feature/shared-drone-configurator
          fi
