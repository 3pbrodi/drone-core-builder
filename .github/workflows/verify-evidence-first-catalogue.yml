name: Verify Evidence First Catalogue

permissions:
  contents: write

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dronecores_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dronecores_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format targeted evidence-first files
        run: >-
          bunx prettier --write
          src/lib/catalogue-demo-seed.ts
          src/lib/catalogue-database.server.ts
          scripts/export-demo-catalogue-seed-sql.ts
          tests/catalogue-demo-seed.test.ts

      - name: Generate committed demo seed
        run: |
          mkdir -p supabase/seeds
          bun run catalogue:export-demo-seed > supabase/seeds/catalogue-demo-seed.sql
          test -s supabase/seeds/catalogue-demo-seed.sql
          grep -q "Prices are illustrative" supabase/seeds/catalogue-demo-seed.sql
          if grep -q "insert into public.catalogue_offers" supabase/seeds/catalogue-demo-seed.sql; then
            echo "Demo seed must not create merchant offers"
            exit 1
          fi

      - name: Full test suite
        run: bun test

      - name: Targeted lint
        run: >-
          bunx eslint
          src/lib/catalogue-demo-seed.ts
          src/lib/catalogue-database.server.ts
          scripts/export-demo-catalogue-seed-sql.ts
          tests/catalogue-demo-seed.test.ts

      - name: Type check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Apply migrations and demo seed twice
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL

          for migration in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 -f supabase/seeds/catalogue-demo-seed.sql
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 -f supabase/seeds/catalogue-demo-seed.sql

      - name: Validate evidence-first seed invariants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            product_count integer;
            review_count integer;
            selectable_demo_count integer;
            offer_count integer;
            import_row_count integer;
            runtime_demo_count integer;
            verified_demo_evidence_count integer;
            normalized_peak_count integer;
          begin
            select count(*) into product_count
            from public.catalogue_products
            where record_class = 'demo_seed';

            if product_count <> 20 then
              raise exception 'Expected 20 demo products, got %', product_count;
            end if;

            select count(*) into review_count
            from public.catalogue_product_quality_reviews q
            join public.catalogue_products p on p.id = q.product_id
            where p.record_class = 'demo_seed';

            if review_count <> 20 then
              raise exception 'Expected 20 demo quality reviews, got %', review_count;
            end if;

            select count(*) into selectable_demo_count
            from public.catalogue_products
            where record_class = 'demo_seed' and selectable = true;

            if selectable_demo_count <> 0 then
              raise exception 'Demo products must never be selectable';
            end if;

            select count(*) into offer_count from public.catalogue_offers;
            if offer_count <> 0 then
              raise exception 'Demo seed must not create merchant offers';
            end if;

            select count(*) into import_row_count
            from public.catalogue_import_rows r
            join public.catalogue_import_batches b on b.id = r.batch_id
            where b.file_name = 'catalogue-demo-seed-phase-a';

            if import_row_count <> 20 then
              raise exception 'Expected 20 demo audit rows, got %', import_row_count;
            end if;

            select count(*) into runtime_demo_count
            from public.catalogue_runtime_products
            where record_class = 'demo_seed';

            if runtime_demo_count <> 0 then
              raise exception 'Demo products leaked into runtime catalogue';
            end if;

            select count(*) into verified_demo_evidence_count
            from public.catalogue_verified_spec_evidence e
            join public.catalogue_products p on p.id = e.product_id
            where p.record_class = 'demo_seed';

            if verified_demo_evidence_count <> 0 then
              raise exception 'Demo evidence leaked into production verified-evidence view';
            end if;

            select count(*) into normalized_peak_count
            from public.catalogue_product_specs s
            join public.catalogue_products p on p.id = s.product_id
            where p.record_class = 'demo_seed'
              and s.peak_current_amps is not null;

            if normalized_peak_count <> 0 then
              raise exception 'Ambiguous demo motor current was normalized as peak current';
            end if;

            if not exists (
              select 1
              from public.catalogue_product_quality_reviews
              where product_id = 'props5'
                and identity_quality_status = 'conflicting'
                and technical_quality_status = 'conflicting'
            ) then
              raise exception 'props5 conflict status was not preserved';
            end if;

            if exists (
              select 1
              from public.catalogue_product_quality_reviews
              where price_status <> 'illustrative'
                 or illustrative_price_currency <> 'EUR'
            ) then
              raise exception 'Demo prices must remain illustrative EUR values';
            end if;
          end
          $$;

          do $$
          begin
            begin
              update public.catalogue_products
              set verification_status = 'verified',
                  identity_status = 'verified',
                  identity_verified_at = now(),
                  selectable = true
              where id = 'cameraFpv';

              raise exception 'Expected demo-selectable constraint to reject promotion';
            exception
              when check_violation then
                null;
            end;
          end
          $$;
          SQL

      - name: Validate canonical EU EUR offer policy
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.catalogue_manufacturers (
            name,
            verification_status
          ) values (
            'Evidence First Test Manufacturer',
            'verified'
          );

          insert into public.catalogue_products (
            id,
            manufacturer_id,
            model,
            display_name,
            category,
            weight_grams,
            lifecycle_status,
            verification_status,
            selectable,
            identity_status,
            identity_verified_at,
            record_class
          ) values (
            'evidence-first-runtime-test',
            (
              select id from public.catalogue_manufacturers
              where name = 'Evidence First Test Manufacturer'
            ),
            'Runtime Test',
            'Runtime Test',
            'frame',
            1,
            'active',
            'verified',
            true,
            'verified',
            now(),
            'canonical'
          );

          insert into public.catalogue_product_specs (
            product_id,
            frame_size_inches,
            motor_mount_pattern
          ) values (
            'evidence-first-runtime-test',
            5,
            '16x16'
          );

          insert into public.catalogue_merchants (
            name,
            verification_status
          ) values (
            'Evidence First Test Merchant',
            'verified'
          );

          insert into public.catalogue_offers (
            product_id,
            merchant_id,
            product_url,
            price_amount,
            currency,
            stock_status,
            region,
            verification_status,
            last_checked_at
          ) values
          (
            'evidence-first-runtime-test',
            (select id from public.catalogue_merchants where name = 'Evidence First Test Merchant'),
            'https://example.com/usd',
            1,
            'USD',
            'in_stock',
            'US',
            'verified',
            now()
          ),
          (
            'evidence-first-runtime-test',
            (select id from public.catalogue_merchants where name = 'Evidence First Test Merchant'),
            'https://example.com/eur',
            2,
            'EUR',
            'in_stock',
            'EU',
            'verified',
            now()
          );

          do $$
          declare
            runtime_price numeric;
            runtime_currency text;
            runtime_region text;
          begin
            select price_amount, currency, offer_region
            into runtime_price, runtime_currency, runtime_region
            from public.catalogue_runtime_products
            where id = 'evidence-first-runtime-test';

            if runtime_price <> 2 or runtime_currency <> 'EUR' or runtime_region <> 'EU' then
              raise exception 'Runtime did not select the verified EU/EUR offer';
            end if;
          end
          $$;
          SQL

      - name: Route smoke test
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/create-custom-build >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=template&template=racer" >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=ai&budget=1200&priorities=footage,range" >/dev/null
          curl -fsS http://127.0.0.1:8080/templates >/dev/null
          curl -fsS http://127.0.0.1:8080/ai-build >/dev/null

      - name: Commit generated seed and targeted formatting
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             supabase/seeds/catalogue-demo-seed.sql             src/lib/catalogue-demo-seed.ts             src/lib/catalogue-database.server.ts             scripts/export-demo-catalogue-seed-sql.ts             tests/catalogue-demo-seed.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Generate evidence-first demo catalogue seed [skip ci]"
            git push origin HEAD:feature/shared-drone-configurator
          fi
