name: Verify Catalogue Phase 2

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dronecores_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dronecores_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint Phase 2 files
        run: >-
          bunx eslint
          src/lib/catalogue-parity.ts
          src/lib/supabase-rest.server.ts
          src/lib/catalogue-database.server.ts
          src/lib/catalogue-import.ts
          src/lib/catalogue-import.server.ts
          scripts/export-static-catalogue.ts

      - name: Production build
        run: bun run build

      - name: Confirm server secret code is absent from client bundle
        run: |
          if grep -R "SUPABASE_SECRET_KEY" .output/public; then
            echo "Server-only secret environment access leaked into client output"
            exit 1
          fi
          if grep -R "sb_secret_REPLACE_ME" .output/public; then
            echo "Secret-key placeholder leaked into client output"
            exit 1
          fi

      - name: Catalogue, CSV, export, and parity smoke tests
        run: |
          bun run catalogue:export-static > /tmp/dronecores-static.csv
          mkdir -p tests
          cat > tests/catalogue-phase2.smoke.ts <<'EOF'
          import { products, categories } from "../src/lib/build-data";
          import { productCatalogue, resolveBuildSelection } from "../src/lib/catalogue-service";
          import { evaluate } from "../src/lib/build-calculations";
          import { compareCatalogueParity } from "../src/lib/catalogue-parity";
          import { validateCatalogueProductCsv } from "../src/lib/catalogue-import";

          function assert(condition: unknown, message: string): asserts condition {
            if (!condition) throw new Error(message);
          }

          const sample = await Bun.file("docs/examples/catalogue-products.sample.csv").text();
          const sampleResult = validateCatalogueProductCsv(sample);
          assert(sampleResult.validRows.length === 1, "sample CSV should contain one valid staged row");
          assert(sampleResult.invalidRows.length === 0, "sample CSV should have no structural errors");

          const sampleLines = sample.trimEnd().split("\n");
          const duplicateCsv = [sampleLines[0], sampleLines[1], sampleLines[1]].join("\n");
          const duplicateResult = validateCatalogueProductCsv(duplicateCsv);
          assert(duplicateResult.validRows.length === 1, "first duplicate ID should remain valid");
          assert(duplicateResult.invalidRows.length === 1, "second duplicate ID should be rejected");
          assert(
            duplicateResult.invalidRows[0]?.errors.some((error) => error.includes("Duplicate product ID")),
            "duplicate error should be explicit",
          );

          const staticCsv = await Bun.file("/tmp/dronecores-static.csv").text();
          const staticResult = validateCatalogueProductCsv(staticCsv);
          assert(staticResult.invalidRows.length === 0, "static catalogue export should parse without structural errors");
          assert(staticResult.validRows.length === products.length, "static export should preserve every product");

          const parity = compareCatalogueParity(products, products);
          assert(parity.ok, "static catalogue should have parity with itself");

          const changed = products.map((product, index) =>
            index === 0 ? { ...product, price: product.price + 1 } : product,
          );
          const failedParity = compareCatalogueParity(products, changed);
          assert(!failedParity.ok, "parity should fail when a runtime price changes");
          assert(
            failedParity.mismatches.some((mismatch) => mismatch.field === "price"),
            "parity failure should identify the changed price",
          );

          for (const category of categories) {
            const categoryProducts = productCatalogue.getProductsByCategory(category);
            assert(categoryProducts.length > 0, `${category} should still have static products`);
          }

          const firstCompleteSelection = {
            frame: "frame5",
            motors: "motors5",
            flightController: "fcF7",
            esc: "esc55",
            propellers: "props5",
            battery: "battery6",
            camera: "cameraFpv",
            receiver: "receiver",
          } as const;
          const stats = evaluate(resolveBuildSelection(firstCompleteSelection));
          assert(stats.complete, "existing complete build should still resolve");
          assert(stats.price > 0, "existing price calculations should still work");

          console.log("Phase 2 catalogue smoke tests passed", {
            staticProducts: products.length,
            sampleReviewIssues: sampleResult.validRows[0]?.reviewIssues.length ?? 0,
            buildPrice: stats.price,
          });
          EOF
          bun tests/catalogue-phase2.smoke.ts

      - name: Validate migration on local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1             -f supabase/migrations/20260927190000_catalogue_phase2.sql
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          select count(*) from public.catalogue_products;
          select count(*) from public.catalogue_runtime_products;
          select count(*) from public.catalogue_import_batches;
          SQL

      - name: Route smoke test
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/create-custom-build >/dev/null
          curl -fsS http://127.0.0.1:8080/ai-build >/dev/null
          curl -fsS http://127.0.0.1:8080/templates >/dev/null

      - name: Full-project lint baseline
        continue-on-error: true
        run: bun run lint
