name: Verify Supabase import integration

on:
  workflow_dispatch:
  push:
    branches:
      - feature/shared-drone-configurator
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/catalogue-import-runner/**"
      - "supabase/functions/_shared/catalogue-import-core.ts"
      - "tests/integration/**"
      - "tests/catalogue-import-variants.test.ts"
      - ".github/workflows/verify-import-integration.yml"

permissions:
  contents: read

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.118.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Lint P0 variant identity core
        run: |
          bunx eslint \
            supabase/functions/_shared/catalogue-import-core.ts \
            tests/catalogue-import-variants.test.ts

      - name: Run importer variant unit tests
        run: bun test tests/catalogue-import-variants.test.ts

      - name: Prepare disposable importer auth
        run: |
          umask 077
          openssl rand -hex 32 > /tmp/catalogue-import-token

      - name: Start disposable local Supabase
        run: supabase start

      - name: Verify repository migration count
        run: test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 23

      - name: Replay repository migrations from zero
        run: supabase db reset --local --yes

      - name: Bootstrap disposable manufacturer sources twice
        env:
          PGPASSWORD: postgres
        run: |
          for pass in 1 2; do
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 \
              -f tests/integration/catalogue-local-staging-bootstrap.sql
          done

      - name: Verify disposable staging readiness
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f tests/integration/catalogue-local-staging-readiness.sql

      - name: Run importer write-path integration tests
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f tests/integration/catalogue-import-reliability.sql

      - name: Run local importer and real-source dry-run
        run: bash tests/integration/catalogue-local-importer-smoke.sh

      - name: Step 5 live HQProp write regression without a manual grant
        run: bash tests/integration/catalogue-step5-local-write-regression.sh

      - name: Save Step 5 local security and write evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step5-fresh-migration-hqprop-evidence
          path: step5-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
