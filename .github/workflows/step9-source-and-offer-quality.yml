name: "Step 9 exact source, variant, merchant conflict and media gate"
on:
  push:
    branches:
      - qa/step9-data-quality-release-20261019
    paths:
      - 'src/lib/catalogue-source-title.ts'
      - 'src/lib/catalogue-evidence-reconciliation.ts'
      - 'tests/catalogue-source-title.test.ts'
      - 'tests/catalogue-evidence-reconciliation.test.ts'
      - 'tests/step9-*'
      - 'src/lib/catalogue-database.server.ts'
      - 'supabase/functions/catalogue-runtime/index.ts'
      - 'supabase/functions/_shared/catalogue-offer-freshness.ts'
      - 'supabase/functions/catalogue-image-refresh/index.ts'
      - 'supabase/migrations/20261019230000_catalogue_runtime_licensed_images_and_fresh_offers.sql'
      - 'tests/integration/step9-disposable-runtime-rights-check.sql'
      - 'supabase/functions/catalogue-image-refresh/index.ts'
      - 'supabase/migrations/20261019230000_catalogue_runtime_licensed_images_and_fresh_offers.sql'
      - 'tests/integration/step8-audit-37-official-pages.ts'
      - 'qa/step9-*'
      - '.github/workflows/step9-source-and-offer-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  official-source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Step 9 QA branch
        uses: actions/checkout@v4
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install pinned Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Run variant and source evidence regressions
        run: |
          bun test tests/catalogue-source-title.test.ts tests/catalogue-evidence-reconciliation.test.ts tests/step9-eight-handoff.test.ts tests/step9-runtime-quality-safety.test.ts tests/step9-offer-read-freshness.test.ts
          deno check tests/integration/step8-audit-37-official-pages.ts
          deno check supabase/functions/catalogue-image-refresh/index.ts
          deno check supabase/functions/catalogue-runtime/index.ts
      - name: Check image refresh Edge Function compiles without publishing any images
        run: deno check supabase/functions/catalogue-image-refresh/index.ts
      - name: Confirm unchanged Production frontend can compile with read-time offer expiration
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Retrieve immutable original 171 manufacturer pilot
        uses: actions/download-artifact@v4
        with:
          repository: 3pbrodi/drone-core-builder
          run-id: 37213658740
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: step9b2-official-source-staging-evidence
          path: original-pilot
      - name: Prepare balanced 37 research source queue
        run: |
          mkdir -p step9-results
          python3 tests/integration/step8-plan-next-batches.py original-pilot step9-results
          jq -e '.summary.total_source_rows==171 and .summary.next_research_queue_count==37
            and .summary.excluded_accessory_or_bundle_count==4 and .summary.all_unverified==true' \
            step9-results/balanced-source-triage.json
      - name: Inspect all 37 manufacturer pages with corrected h1 selection
        run: |
          deno run \
            --allow-read=step9-results/balanced-source-triage.json \
            --allow-write=step9-results/official-source-audit-37.json \
            --allow-net=www.hqprop.com,www.foxeer.com,www.speedybee.com,www.team-blacksheep.com \
            tests/integration/step8-audit-37-official-pages.ts \
            step9-results/balanced-source-triage.json \
            step9-results/official-source-audit-37.json
          jq -e '.summary.research_candidates==37
            and .summary.human_approved_for_publication==0
            and .summary.formal_identity_verified==0
            and .summary.production_database_writes==0
            and .summary.manufacturer_images_downloaded==0
            and (.observations|length)==37' \
            step9-results/official-source-audit-37.json
      - name: Preserve only research evidence without images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step9-seven-product-quality-and-37-source-readonly
          path: step9-results/
          retention-days: 30
          if-no-files-found: warn

  disposable-licensing-and-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout strict QA branch
        uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.118.0
      - name: Start a fresh disposable-only database with new SQL image rights gate
        run: |
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          supabase start
          supabase db reset --local --yes
      - name: Prove license and fresh-offer view requirements
        run: |
          mkdir -p step9-results
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -X -At -v ON_ERROR_STOP=1 \
            -f tests/integration/step9-disposable-runtime-rights-check.sql \
            >step9-results/disposable-safety-output.txt
          tail -1 step9-results/disposable-safety-output.txt | jq . \
            >step9-results/disposable-safety-audit.json
          jq -e '.migrations==25 and .public_runtime_products==0
            and .license_filter_on==true and .fresh_offer_filter_on==true
            and .production_mutation==false and .step=="PASS"' \
            step9-results/disposable-safety-audit.json
      - name: Retain SQL regression proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step9-disposable-license-and-freshness-no-production
          path: step9-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Destroy disposable database and all state
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
