name: Verify Compatibility Priority 2

permissions:
  contents: write

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Priority 2 files
        run: bunx prettier --write src/lib/build-calculations.ts tests/build-calculations.test.ts

      - name: Compatibility tests
        run: bun test tests/build-calculations.test.ts

      - name: Targeted lint
        run: bunx eslint src/lib/build-calculations.ts tests/build-calculations.test.ts

      - name: Type check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Start development server
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dronecores-vite.log
          exit 1

      - name: Shared configurator route smoke test
        run: |
          curl -fsS http://127.0.0.1:8080/create-custom-build >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=template&template=racer" >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=ai&budget=1200&priorities=footage,range" >/dev/null
          curl -fsS http://127.0.0.1:8080/ai-build >/dev/null
          curl -fsS http://127.0.0.1:8080/templates >/dev/null

      - name: Commit targeted formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/build-calculations.ts tests/build-calculations.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Priority 2 compatibility files [skip ci]"
            git push origin HEAD:feature/shared-drone-configurator
          fi
