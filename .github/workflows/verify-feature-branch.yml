name: Verify DroneCores feature branch

on:
  push:
    branches:
      - feature/shared-drone-configurator
      - fix/offer-refresh-reliability-20261004
  pull_request:
    branches:
      - main
      - feature/shared-drone-configurator

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Lint P0 importer core
        run: bunx eslint supabase/functions/_shared/catalogue-import-core.ts tests/catalogue-import-variants.test.ts

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Type-check Edge importer
        run: deno check supabase/functions/catalogue-import-runner/index.ts

      - name: Type-check all catalogue Edge Functions
        run: |
          deno check supabase/functions/catalogue-offer-refresh/index.ts
          deno check supabase/functions/catalogue-image-refresh/index.ts
          deno check supabase/functions/catalogue-runtime/index.ts

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build
