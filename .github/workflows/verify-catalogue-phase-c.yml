name: Verify Catalogue Phase C

permissions:
  contents: write

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dronecores_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dronecores_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Phase C files
        run: >-
          bunx prettier --write
          src/lib/catalogue-import.ts
          src/lib/catalogue-import.server.ts
          src/lib/catalogue-source.server.ts
          src/lib/catalogue-evidence-import.ts
          src/lib/catalogue-evidence-import.server.ts
          src/lib/catalogue-source-snapshot.ts
          src/lib/catalogue-source-snapshot.server.ts
          tests/catalogue-evidence-import.test.ts

      - name: Catalogue and compatibility tests
        run: >-
          bun test
          tests/catalogue-quality.test.ts
          tests/catalogue-evidence.test.ts
          tests/catalogue-evidence-import.test.ts
          tests/build-calculations.test.ts

      - name: Targeted lint
        run: >-
          bunx eslint
          src/lib/catalogue-import.ts
          src/lib/catalogue-import.server.ts
          src/lib/catalogue-source.server.ts
          src/lib/catalogue-evidence-import.ts
          src/lib/catalogue-evidence-import.server.ts
          src/lib/catalogue-source-snapshot.ts
          src/lib/catalogue-source-snapshot.server.ts
          tests/catalogue-evidence-import.test.ts

      - name: Type check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Validate Phase A-C migrations on local PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL

          for migration in             supabase/migrations/20260927190000_catalogue_phase2.sql             supabase/migrations/20260928210000_catalogue_evidence_phase_b.sql             supabase/migrations/20260928220000_catalogue_import_phase_c.sql
          do
            psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.catalogue_sources (
            id, name, kind, verification_status
          ) values (
            '00000000-0000-0000-0000-000000000001',
            'Phase C source',
            'manufacturer',
            'verified'
          );

          insert into public.catalogue_import_batches (
            source_id,
            file_name,
            import_kind,
            status,
            total_rows,
            valid_rows,
            invalid_rows
          ) values (
            null,
            'reviewed-evidence.csv',
            'spec_evidence',
            'needs_review',
            1,
            1,
            0
          );

          insert into public.catalogue_source_snapshots (
            source_id,
            external_product_id,
            source_url,
            content_hash,
            retrieved_at
          ) values (
            '00000000-0000-0000-0000-000000000001',
            'example-product',
            'https://example.com/product',
            'abc123',
            now()
          );

          select import_kind, status from public.catalogue_import_batches;
          select count(*) from public.catalogue_source_snapshots;
          SQL

      - name: Route smoke test
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/create-custom-build >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=template&template=racer" >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=ai&budget=1200&priorities=footage,range" >/dev/null
          curl -fsS http://127.0.0.1:8080/templates >/dev/null
          curl -fsS http://127.0.0.1:8080/ai-build >/dev/null

      - name: Commit targeted formatting
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/lib/catalogue-import.ts             src/lib/catalogue-import.server.ts             src/lib/catalogue-source.server.ts             src/lib/catalogue-evidence-import.ts             src/lib/catalogue-evidence-import.server.ts             src/lib/catalogue-source-snapshot.ts             src/lib/catalogue-source-snapshot.server.ts             tests/catalogue-evidence-import.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Phase C catalogue files [skip ci]"
            git push origin HEAD:feature/shared-drone-configurator
          fi
