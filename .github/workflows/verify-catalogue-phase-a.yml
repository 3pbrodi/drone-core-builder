name: Verify Catalogue Phase A

permissions:
  contents: write

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format new Phase A files
        run: bunx prettier --write src/lib/catalogue-quality.ts tests/catalogue-quality.test.ts

      - name: Catalogue quality tests
        run: bun test tests/catalogue-quality.test.ts tests/build-calculations.test.ts

      - name: Targeted lint
        run: bunx eslint src/lib/catalogue-quality.ts tests/catalogue-quality.test.ts

      - name: Type check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Confirm template claims are illustrative
        run: |
          if grep -R "complete, proven parts list" src/routes/templates.tsx; then
            echo "Overstated template claim still present"
            exit 1
          fi
          grep -q "illustrative starting point" src/routes/templates.tsx
          grep -q "Est. flight" src/routes/templates.tsx
          grep -q "Est. speed" src/routes/templates.tsx

      - name: Route smoke test
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/create-custom-build >/dev/null
          curl -fsS http://127.0.0.1:8080/ai-build >/dev/null
          curl -fsS http://127.0.0.1:8080/templates >/dev/null

      - name: Commit formatting fixes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalogue-quality.ts tests/catalogue-quality.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Phase A catalogue files [skip ci]"
            git push origin HEAD:feature/shared-drone-configurator
          fi
