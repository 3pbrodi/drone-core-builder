if(s===4){const name=ai.style==="Racing"?"Track Rocket Build":ai.style==="Long Range"?"Long-Range Explorer Build":ai.style==="FPV"?"Immersive FPV Build":ai.budget<700?"First Racer Build":ai.budget>1500?"Silent Shutter Pro Build":"Backpack Cinematic Build";content='<p class="eyebrow" style="margin-top:0">Your answers</p><p>Budget: '+fmt(ai.budget)+' · Color: '+esc(ai.color||"Skipped")+' · Style: '+esc(ai.style||"Skipped")+'</p><p>Wishes: '+esc(ai.wishes||"Skipped")+'</p><button class="button" onclick="ai={step:0,budget:1000,color:\'\',style:\'\',wishes:\'\'};render()">↻ Start over</button><hr style="border:0;border-top:1px solid var(--border);margin:22px 0"><p class="eyebrow" style="margin-top:0">AI suggestion · sample</p><h2>'+name+'</h2><ul><li>5-inch carbon drone frame suited to your flying style</li><li>Efficient brushless motors matched to your budget</li><li>Camera system selected for '+esc(ai.style||"general flying")+'</li><li>Battery sized for balanced flight time and power</li><li>'+(ai.color?"Custom shell in "+esc(ai.color):"Classic factory shell")+'</li></ul><p class="muted-box">Sample preview — this demo answers from a fixed list. Real AI builds arrive in a later step.</p>'}
return shell("/ai-build","AI Build","Answer four quick questions — budget, color, flying style, and any special wishes — and get a suggested parts list.",'<div class="progress"><span style="width:'+Math.min(100,s*25)+'%"></span></div><section class="card" style="max-width:760px;margin:24px auto;padding:28px"><p class="eyebrow" style="margin-top:0">Step '+Math.min(s+1,4)+' of 4 — '+["Budget","Preferred color","Flying style","Special wishes"][Math.min(s,3)]+'</p>'+content+'</section>',"Path 3")}
async function initUser(){if(supabase){try{const {data}=await supabase.auth.getUser();user=data.user?{id:data.user.id,email:data.user.email,name:data.user.user_metadata?.name||data.user.email}:null}catch{}}else loadUser()}
function loginPage(){let title=loginMode==="signup"?"Create your account":loginMode==="forgot"?"Reset password":"Welcome back";return '<div class="auth"><aside class="auth-brand"><a class="brand" href="index.html" style="color:white">'+logo()+'<span>DroneCores</span></a><div><h1>Build the drone you’ve always wanted.</h1><p>Configure, compare and order custom drones. No experience needed.</p><ul><li>Custom, template and AI-assisted builds</li><li>Catalog of drones from major brands</li><li>Save and share your configurations</li></ul></div><small>© 2026 DroneCores</small></aside><main class="auth-form"><div class="form-wrap"><a class="brand" href="index.html" style="margin-bottom:28px">'+logo()+'<span>DroneCores</span></a><h2>'+title+'</h2><p>'+ (loginMode==="signup"?"Create an account to continue building.":"Sign in to continue building your drones.")+'</p>'+ (authError?'<div class="alert error" role="alert">'+esc(authError)+'</div>':"")+(authNotice?'<div class="alert success" role="status">'+esc(authNotice)+'</div>':"")+ (loginMode==="forgot"?'<div class="stack"><label>Email<input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></label><button class="button primary" onclick="resetPassword()">Send reset email</button><button class="button" onclick="loginMode=\'signin\';authNotice=\'\';render()">Back to sign in</button></div>':'<div class="muted-box" style="margin:20px 0;text-align:center">Google &nbsp; · &nbsp; GitHub &nbsp; <span class="tag">Soon</span></div><div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px">or continue with email</div>'+(loginMode==="signup"?'<div class="form-field"><label>Name (optional)</label><input id="authName" type="text" autocomplete="name" placeholder="Your name"></div>':'')+'<div class="form-field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="form-field"><label>Password</label><input id="authPassword" type="password" autocomplete="'+(loginMode==="signup"?"new-password":"current-password")+'" placeholder="Enter your password"></div>'+(loginMode==="signin"?'<p style="text-align:right"><button class="link" onclick="loginMode=\'forgot\';authError=\'\';render()">Forgot password?</button></p>':'')+'<button class="button primary" style="width:100%;margin-top:14px" onclick="submitAuth()">'+(authBusy?"Please wait…":loginMode==="signup"?"Create account":"Sign in")+'</button><p style="text-align:center">'+(loginMode==="signup"?"Already have an account?":"Don’t have an account?")+' <button class="link" onclick="loginMode=\''+(loginMode==="signup"?"signin":"signup")+'\';authError=\'\';authNotice=\'\';render()">'+(loginMode==="signup"?"Sign in":"Create one")+'</button></p>')+'<p class="form-foot">By continuing, you agree to DroneCores’ Terms of Service and Privacy Policy.</p></div></main></div>'}
async function submitAuth(){const email=document.getElementById("authEmail")?.value.trim().toLowerCase()||"",password=document.getElementById("authPassword")?.value||"",name=document.getElementById("authName")?.value.trim()||"";authError="";authNotice="";if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){authError="Enter a valid email address.";render();return}if(!password){authError="Enter your password.";render();return}authBusy=true;render();if(supabase){try{if(loginMode==="signup"){const {data,error}=await supabase.auth.signUp({email,password,options:{data:{name},emailRedirectTo:location.href.split("#")[0]}});if(error)throw error;if(data.session){user={id:data.user.id,email,name:name||email};authNotice="Account created. You’re signed in."}else{authNotice="Check your email to confirm your account, then sign in."}loginMode="signin"}else{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;user={id:data.user.id,email:data.user.email,name:data.user.user_metadata?.name||email};go("/")} }catch(e){authError=e.message||"Sign in failed."}}else{authError="Login needs an internet connection to reach the account service."}authBusy=false;render()}
async function resetPassword(){const email=document.getElementById("authEmail")?.value.trim();if(!email){authError="Enter your email address.";render();return}if(!supabase){authError="Password reset needs an internet connection.";render();return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:new URL("reset-password.html",location.href).href});authError=error?.message||"";authNotice=error?"":"If an account exists for this address, a reset link has been sent.";render()}
function logout(){if(supabase)supabase.auth.signOut();localStorage.removeItem("dronecores.session");user=null;go("/")}
function billingPage(){if(!user)return '<main class="auth-form"><div class="form-wrap"><h1>Sign in to manage billing</h1><a class="button primary" href="login.html">Sign in</a></div></main>';let key="dronecores.html.billing."+user.id,b;try{b=JSON.parse(localStorage.getItem(key)||"null")}catch{}if(!b){b={plan:"pro",interval:"monthly",card:true,email:user.email,usage:[4,15,6],cancel:false};localStorage.setItem(key,JSON.stringify(b))}const lim=b.plan==="free"?[10,3,0]:b.plan==="pro"?[100,50,20]:[500,"∞","∞"];const used=["AI builds","Saved builds","Parts list exports"];const prices={free:0,pro:19,team:49};const planbox='<section class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><article class="card"><span class="tag">Current plan</span><h2>'+b.plan[0].toUpperCase()+b.plan.slice(1)+' plan</h2><p>'+euro(b.plan==="free"?0:prices[b.plan])+' / month</p><p class="muted-box">'+(b.cancel?"Cancellation scheduled.":"Your plan is active.")+'</p><button class="button" onclick="cancelPlan()">Cancel subscription</button></article><article class="card"><h2>Usage this month</h2>'+used.map((x,i)=>'<p><span class="row"><span>'+x+'</span><span>'+b.usage[i]+' / '+lim[i]+'</span></span><span class="progress" style="display:block;margin-top:5px"><span style="width:'+ (lim[i]==="∞"?100:Math.min(100,b.usage[i]/lim[i]*100))+'%"></span></span></p>').join('')+'</article></section>';
const plans='<div class="row" style="margin:24px 0"><h2>Choose your plan</h2><div><button class="button small '+(interval==="monthly"?"primary":"")+'" onclick="interval=\'monthly\';render()">Monthly</button> <button class="button small '+(interval==="yearly"?"primary":"")+'" onclick="interval=\'yearly\';render()">Yearly · save 20%</button></div></div><div class="grid three">'+["free","pro","team"].map((p,i)=>'<article class="card"><span class="tag">'+p.toUpperCase()+'</span><h2>'+["Free","Pro","Team"][i]+'</h2><div style="font-size:28px;font-weight:700">'+euro(p==="free"?0:Math.round(prices[p]*(interval==="yearly"?.8:1)))+'<small style="font-size:13px;font-weight:400"> / month</small></div><p>'+["For your first drone.","For hobbyists and small builders.","For clubs and small companies."][i]+'</p><button class="button '+(b.plan===p?"":"primary")+'" style="width:100%" onclick="choosePlan(\''+p+'\')">'+(b.plan===p?"Current plan":p==="free"?"Downgrade to Free":b.plan==="free"?"Upgrade to "+p[0].toUpperCase()+p.slice(1):"Switch to "+p[0].toUpperCase()+p.slice(1))+'</button><ul><li>'+["10 AI builds / month","100 AI builds / month","500 AI builds / month"][i]+'</li><li>'+["3 saved builds","50 saved builds","Unlimited saved builds"][i]+'</li><li>Community support</li></ul></article>').join('')+'</div>';
const cardbox='<article class="card" style="margin-top:20px"><h2>Payment method</h2><p>Used for your subscription and invoices.</p><div class="muted-box">'+(b.card?"VISA &nbsp; Visa ending in 4242 &nbsp; · &nbsp; Default":"No payment method added")+' <button class="button small" style="float:right" onclick="cardAction()">'+(b.card?"Remove":"Add demo card")+'</button></div><p class="form-field"><label>Billing email</label><div class="row"><span>'+esc(b.email)+'</span><button class="button small" onclick="editBillingEmail()">Edit</button></div></p></article>';
const invoices='<article class="card" style="margin-top:20px"><h2>Invoice history</h2><p>Download receipts for your records.</p><div style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Invoice no.</th><th>Description</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+[0,1,2,3].map(i=>'<tr><td>'+new Date(Date.now()-i*30*86400000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+'</td><td>DEMO-000'+(4-i)+'</td><td>Pro plan, monthly</td><td>€19.00</td><td><span class="tag" style="background:#eaf8ef;color:#087443">Paid</span></td></tr>').join('')+'</tbody></table></div></article>';
return header("/billing")+'<main style="background:#f4f6fc"><h1>Billing</h1><p>Manage your plan, payment method and invoices.</p><div class="alert"><strong>Demo mode:</strong> no real payments are processed.</div>'+planbox+plans+cardbox+invoices+'</main>'+footer()}
function saveBilling(b){localStorage.setItem("dronecores.html.billing."+user.id,JSON.stringify(b));render()}
function choosePlan(p){let b=JSON.parse(localStorage.getItem("dronecores.html.billing."+user.id));if(p!=="free"&&!b.card){toast="Add a demo card before choosing a paid plan.";render();return}b.plan=p;b.interval=interval;b.cancel=false;saveBilling(b)}
function cancelPlan(){let b=JSON.parse(localStorage.getItem("dronecores.html.billing."+user.id));if(confirm("Cancel your subscription at the end of the current period?")){b.cancel=true;saveBilling(b)}}
function cardAction(){let b=JSON.parse(localStorage.getItem("dronecores.html.billing."+user.id));if(b.card&&b.plan!=="free"){toast="Switch to Free before removing your demo card.";render();return}b.card=!b.card;saveBilling(b)}
function editBillingEmail(){const b=JSON.parse(localStorage.getItem("dronecores.html.billing."+user.id)),email=prompt("Billing email",b.email);if(email&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){b.email=email;saveBilling(b)}}
function resetPage(){return '<main><section class="card" style="max-width:440px;margin:60px auto"><h1>Choose a new password</h1><p>Set a new password for your account.</p><label>New password<input id="newPassword" type="password" minlength="8"></label><button class="button primary" style="width:100%;margin-top:16px" onclick="changePassword()">Update password</button><p id="resetMessage"></p></section></main>'}
async function changePassword(){if(!supabase){document.getElementById("resetMessage").textContent="Password reset needs an internet connection.";return}const {error}=await supabase.auth.updateUser({password:document.getElementById("newPassword").value});document.getElementById("resetMessage").textContent=error?.message||"Password updated. You can now sign in."}
function render(){const r=route();document.title=(r==="/"?"DroneCores — Build the drone you actually want":r.slice(1).replaceAll("-"," ").replace(/^./,c=>c.toUpperCase())+" — DroneCores");app.innerHTML=r==="/"?homepage():r==="/templates"?templatesPage():r==="/pre-built"?prebuiltPage():r==="/create-custom-build"?customPage():r==="/ai-build"?aiPage():r==="/login"?loginPage():r==="/billing"?billingPage():resetPage();if(toast){app.insertAdjacentHTML("afterbegin",'<div class="alert" style="position:fixed;z-index:60;top:74px;left:50%;transform:translateX(-50%);box-shadow:0 6px 24px #1233">'+esc(toast)+'</div>');toast="";setTimeout(()=>document.querySelector(".alert[style*='position:fixed']")?.remove(),2200)}}

window.addEventListener("storage",()=>{loadUser();render()});
if(supabase)supabase.auth.onAuthStateChange((_event,session)=>{user=session?.user?{id:session.user.id,email:session.user.email,name:session.user.user_metadata?.name||session.user.email}:null;render()});
try{const d=JSON.parse(localStorage.getItem("dronecores.draft")||"null");if(Array.isArray(d))selectedParts=new Set(d)}catch{}
render();
