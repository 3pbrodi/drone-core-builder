name: Verify Runtime Fixes

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start development server
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dronecores-vite.log
          exit 1

      - name: Browser smoke tests
        run: |
          mkdir -p tests
          cat > tests/runtime-smoke.spec.ts <<'EOF'
          import { test, expect } from "@playwright/test";

          test("custom build survives first component selection", async ({ page }) => {
            const errors: string[] = [];
            page.on("pageerror", error => errors.push(error.message));
            await page.goto("http://127.0.0.1:8080/create-custom-build");
            await expect(page.getByRole("heading", { name: "Custom Build" })).toBeVisible();
            await page.getByRole("button", { name: /Select Component/ }).first().click();
            await expect(page.getByRole("dialog")).toBeVisible();
            await page.getByRole("button", { name: /Select component/ }).first().click();
            await expect(page.getByText("Your drone will appear here")).toHaveCount(0);
            await page.waitForTimeout(1200);
            expect(errors).toEqual([]);
          });

          test("template build loads shared configurator", async ({ page }) => {
            const errors: string[] = [];
            page.on("pageerror", error => errors.push(error.message));
            await page.goto("http://127.0.0.1:8080/create-custom-build?source=template&template=freestyle");
            await expect(page.getByText("Template", { exact: true })).toBeVisible();
            await expect(page.getByText("FPV Freestyle Rig", { exact: true })).toBeVisible();
            await page.waitForTimeout(1200);
            expect(errors).toEqual([]);
          });

          test("AI questionnaire hands off without crashing", async ({ page }) => {
            const errors: string[] = [];
            page.on("pageerror", error => errors.push(error.message));
            await page.goto("http://127.0.0.1:8080/ai-build");
            await page.getByRole("button", { name: "Skip" }).click();
            await expect(page.getByRole("heading", { name: "What matters most to you?" })).toBeVisible();
            await page.getByRole("button", { name: /Crisp, Stable Camera Footage/ }).click();
            await page.getByRole("button", { name: "Continue" }).click();
            await page.getByRole("button", { name: "Skip" }).click();
            await page.getByRole("button", { name: "Skip" }).click();
            await expect(page.getByText("AI Build", { exact: true })).toBeVisible();
            await page.waitForTimeout(1200);
            expect(errors).toEqual([]);
          });
          EOF
          npx playwright test tests/runtime-smoke.spec.ts --reporter=line --workers=1
