name: Generate P0 import migration

on:
  push:
    branches:
      - feature/shared-drone-configurator
    paths:
      - ".github/workflows/generate-p0-import-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-drone-configurator
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Create migration with Supabase CLI
        run: supabase migration new p0_import_reliability
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Create P0 import reliability migration"
          git push origin HEAD:feature/shared-drone-configurator
