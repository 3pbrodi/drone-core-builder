name: Verify Runtime Fixes

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start development server
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dronecores-vite.log
          exit 1

      - name: Browser smoke tests
        run: |
          mkdir -p tests
          cat > tests/runtime-smoke.spec.ts <<'EOF'
          import { test, expect } from "@playwright/test";

          function watch(page: import("@playwright/test").Page) {
            const errors: string[] = [];
            page.on("pageerror", error => {
              errors.push(error.message);
              console.log("PAGEERROR:", error.message);
            });
            page.on("console", message => {
              if (message.type() === "error") console.log("CONSOLE ERROR:", message.text());
            });
            return errors;
          }

          test("custom build survives component selection", async ({ page }) => {
            const errors = watch(page);
            await page.goto("http://127.0.0.1:8080/create-custom-build");
            await expect(page.getByRole("heading", { name: "Custom Build" })).toBeVisible();
            await page.waitForTimeout(1000);
            const frameHeading = page.getByRole("heading", { name: "Frame", exact: true });
            await expect(frameHeading).toBeVisible();
            const frameRow = frameHeading.locator("..").locator("..");
            const selectButton = frameRow.getByRole("button", { name: /Select Component/ });
            await expect(selectButton).toBeVisible();
            console.log("FRAME BUTTON disabled:", await selectButton.isDisabled());
            await selectButton.evaluate((element) => (element as HTMLButtonElement).click());
            await expect(page.locator('[role="dialog"]')).toBeVisible();
            await page.locator('[role="dialog"] button').filter({ hasText: "Select component" }).first().click();
            await page.waitForTimeout(1500);
            await expect(page.getByText("This page didn't load")).toHaveCount(0);
            expect(errors).toEqual([]);
          });

          test("template build loads shared configurator", async ({ page }) => {
            const errors = watch(page);
            await page.goto("http://127.0.0.1:8080/create-custom-build?source=template&template=freestyle");
            await expect(page.getByText("Template", { exact: true })).toBeVisible();
            await expect(page.getByText("FPV Freestyle Rig", { exact: true })).toBeVisible();
            await page.waitForTimeout(1500);
            await expect(page.getByText("This page didn't load")).toHaveCount(0);
            expect(errors).toEqual([]);
          });

          test("AI questionnaire hands off without crashing", async ({ page }) => {
            const errors = watch(page);
            await page.goto("http://127.0.0.1:8080/ai-build");
            await expect(page.getByText("What is your budget?")).toBeVisible();
            await page.waitForTimeout(1000);
            await page.locator("button").filter({ hasText: "Skip" }).click();
            await expect(page.getByText("What matters most to you?")).toBeVisible();
            await page.locator("button").filter({ hasText: "Crisp, Stable Camera Footage" }).click();
            await page.locator("button").filter({ hasText: "Continue" }).click();
            await expect(page.getByText("What color should your drone be?")).toBeVisible();
            await page.locator("button").filter({ hasText: "Skip" }).click();
            await expect(page.getByText("Personalization", { exact: true })).toBeVisible();
            await page.locator("button").filter({ hasText: "Skip" }).click();
            await expect(page.getByText("AI Build", { exact: true })).toBeVisible();
            await page.waitForTimeout(1500);
            await expect(page.getByText("This page didn't load")).toHaveCount(0);
            expect(errors).toEqual([]);
          });

          EOF
          npx playwright test tests/runtime-smoke.spec.ts --reporter=line --workers=1
