name: Verify Catalogue Phase D

permissions:
  contents: write

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format new Phase D files
        run: >-
          bunx prettier --write
          src/lib/static-catalogue-evidence.ts
          tests/static-catalogue-evidence.test.ts

      - name: Compatibility and evidence tests
        run: >-
          bun test
          tests/catalogue-quality.test.ts
          tests/catalogue-evidence.test.ts
          tests/catalogue-evidence-import.test.ts
          tests/static-catalogue-evidence.test.ts
          tests/build-calculations.test.ts

      - name: Targeted lint
        run: >-
          bunx eslint
          src/lib/static-catalogue-evidence.ts
          tests/static-catalogue-evidence.test.ts

      - name: Type check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Route smoke test
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/create-custom-build >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=template&template=racer" >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=ai&budget=1200&priorities=footage,range" >/dev/null
          curl -fsS http://127.0.0.1:8080/templates >/dev/null
          curl -fsS http://127.0.0.1:8080/ai-build >/dev/null

      - name: Commit targeted formatting
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/static-catalogue-evidence.ts tests/static-catalogue-evidence.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Phase D evidence files [skip ci]"
            git push origin HEAD:feature/shared-drone-configurator
          fi
