name: Verify Catalogue Promotion Workflow

permissions:
  contents: write

on:
  push:
    branches:
      - feature/shared-drone-configurator
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dronecores_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dronecores_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format targeted server file
        run: bunx prettier --write src/lib/catalogue-promotion.server.ts

      - name: Full test suite
        run: bun test

      - name: Targeted lint
        run: >-
          bunx eslint
          src/lib/catalogue-promotion.server.ts
          src/lib/catalogue-demo-seed.ts
          src/lib/catalogue-database.server.ts

      - name: Type check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Apply all migrations and demo seed
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL

          for migration in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 \
            -f supabase/seeds/catalogue-demo-seed.sql

      - name: Verify blocked demo promotion
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          do $test$
          begin
            if cardinality(public.catalogue_identity_promotion_blockers('props5')) = 0 then
              raise exception 'Conflicting demo product unexpectedly has no identity blockers.';
            end if;

            begin
              update public.catalogue_products
              set record_class = 'canonical'
              where id = 'props5';

              raise exception 'BYPASS_SUCCEEDED';
            exception
              when others then
                if sqlerrm = 'BYPASS_SUCCEEDED' then
                  raise;
                end if;
            end;
          end;
          $test$;
          SQL

      - name: Exercise full review and promotion workflow
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d dronecores_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.catalogue_import_batches (
            file_name,
            status,
            total_rows,
            valid_rows,
            invalid_rows,
            notes,
            import_kind
          ) values (
            'promotion-workflow-product',
            'needs_review',
            1,
            1,
            0,
            'CI review workflow fixture',
            'products'
          )
          returning id as product_batch_id \gset

          insert into public.catalogue_import_rows (
            batch_id,
            row_number,
            proposed_product_id,
            raw_data,
            normalized_data,
            status,
            validation_errors
          ) values (
            :'product_batch_id',
            1,
            'workflow-frame',
            '{"fixture":true}'::jsonb,
            jsonb_build_object(
              'id', 'workflow-frame',
              'category', 'frame',
              'display_name', 'Workflow Frame 5',
              'manufacturer', 'Workflow Manufacturer',
              'model', 'WF5',
              'spec_summary', '5-inch review workflow fixture',
              'weight_grams', 100,
              'frame_size_inches', 5,
              'motor_mount_pattern', '16x16'
            ),
            'needs_review',
            '[]'::jsonb
          )
          returning id as product_import_row_id \gset

          select public.catalogue_create_candidate_from_import(
            :product_import_row_id,
            'ci-reviewer',
            'Create review candidate'
          );

          do $test$
          begin
            if not exists (
              select 1
              from public.catalogue_products
              where id = 'workflow-frame'
                and record_class = 'candidate'
                and selectable = false
                and identity_status = 'pending_review'
            ) then
              raise exception 'Candidate product was not created correctly.';
            end if;

            begin
              update public.catalogue_products
              set record_class = 'canonical'
              where id = 'workflow-frame';

              raise exception 'BYPASS_SUCCEEDED';
            exception
              when others then
                if sqlerrm = 'BYPASS_SUCCEEDED' then
                  raise;
                end if;
            end;
          end;
          $test$;

          insert into public.catalogue_sources (
            name,
            kind,
            base_url,
            verification_status
          ) values (
            'Workflow Manufacturer Documentation',
            'manufacturer',
            'https://example.com/manufacturer',
            'pending_review'
          )
          returning id as identity_source_id \gset

          insert into public.catalogue_identity_evidence (
            product_id,
            source_id,
            source_url,
            authority,
            manufacturer_label,
            model_label,
            exact_model_association,
            verification_status,
            retrieved_at
          ) values (
            'workflow-frame',
            :'identity_source_id',
            'https://example.com/manufacturer/wf5',
            'manufacturer',
            'Workflow Manufacturer',
            'WF5',
            true,
            'pending_review',
            now()
          )
          returning id as identity_evidence_id \gset

          select public.catalogue_verify_identity_evidence(
            :'identity_evidence_id',
            'ci-reviewer',
            'Exact identity reviewed'
          );

          select public.catalogue_promote_identity(
            'workflow-frame',
            'ci-reviewer',
            'Identity promotion approved'
          );

          do $test$
          begin
            if not exists (
              select 1
              from public.catalogue_products
              where id = 'workflow-frame'
                and record_class = 'canonical'
                and identity_status = 'verified'
                and selectable = false
            ) then
              raise exception 'Identity promotion did not produce a non-selectable canonical product.';
            end if;

            begin
              update public.catalogue_products
              set selectable = true,
                  verification_status = 'verified'
              where id = 'workflow-frame';

              raise exception 'BYPASS_SUCCEEDED';
            exception
              when others then
                if sqlerrm = 'BYPASS_SUCCEEDED' then
                  raise;
                end if;
            end;
          end;
          $test$;

          insert into public.catalogue_spec_evidence (
            product_id,
            field_key,
            value,
            unit,
            source_id,
            source_url,
            authority,
            exact_model_association,
            verification_status,
            retrieved_at
          ) values (
            'workflow-frame',
            'frameInches',
            '7'::jsonb,
            'in',
            :'identity_source_id',
            'https://example.com/manufacturer/wf5-wrong',
            'manufacturer',
            true,
            'pending_review',
            now()
          )
          returning id as wrong_evidence_id \gset

          do $test$
          declare
            v_wrong_evidence_id uuid;
          begin
            select id
            into v_wrong_evidence_id
            from public.catalogue_spec_evidence
            where product_id = 'workflow-frame'
              and field_key = 'frameInches'
              and source_url = 'https://example.com/manufacturer/wf5-wrong'
            limit 1;

            begin
              perform public.catalogue_verify_spec_evidence(
                v_wrong_evidence_id,
                'ci-reviewer',
                'Must fail because source value does not match stored value'
              );

              raise exception 'MISMATCH_VERIFICATION_SUCCEEDED';
            exception
              when others then
                if sqlerrm = 'MISMATCH_VERIFICATION_SUCCEEDED' then
                  raise;
                end if;
            end;
          end;
          $test$;

          insert into public.catalogue_import_batches (
            file_name,
            status,
            total_rows,
            valid_rows,
            invalid_rows,
            notes,
            import_kind
          ) values (
            'promotion-workflow-evidence',
            'needs_review',
            2,
            2,
            0,
            'CI specification evidence fixture',
            'spec_evidence'
          )
          returning id as evidence_batch_id \gset

          insert into public.catalogue_import_rows (
            batch_id,
            row_number,
            proposed_product_id,
            raw_data,
            normalized_data,
            status,
            validation_errors
          ) values (
            :'evidence_batch_id',
            1,
            'workflow-frame',
            '{"fixture":"frameInches"}'::jsonb,
            jsonb_build_object(
              'productId', 'workflow-frame',
              'fieldKey', 'frameInches',
              'value', 5,
              'unit', 'in',
              'valueSemantics', 'nominal frame size',
              'sourceName', 'Workflow Manufacturer Documentation',
              'sourceKind', 'manufacturer',
              'sourceUrl', 'https://example.com/manufacturer/wf5',
              'authority', 'manufacturer',
              'exactModelAssociation', true,
              'retrievedAt', to_char(now(), 'YYYY-MM-DD"T"HH24:MI:SSOF'),
              'conditions', '{}'::jsonb,
              'verificationStatus', 'pending_review'
            ),
            'needs_review',
            '[]'::jsonb
          )
          returning id as frame_size_import_id \gset

          insert into public.catalogue_import_rows (
            batch_id,
            row_number,
            proposed_product_id,
            raw_data,
            normalized_data,
            status,
            validation_errors
          ) values (
            :'evidence_batch_id',
            2,
            'workflow-frame',
            '{"fixture":"mount"}'::jsonb,
            jsonb_build_object(
              'productId', 'workflow-frame',
              'fieldKey', 'mount',
              'value', '16x16',
              'unit', 'mm',
              'valueSemantics', 'motor mounting pattern',
              'sourceName', 'Workflow Manufacturer Documentation',
              'sourceKind', 'manufacturer',
              'sourceUrl', 'https://example.com/manufacturer/wf5',
              'authority', 'manufacturer',
              'exactModelAssociation', true,
              'retrievedAt', to_char(now(), 'YYYY-MM-DD"T"HH24:MI:SSOF'),
              'conditions', '{}'::jsonb,
              'verificationStatus', 'pending_review'
            ),
            'needs_review',
            '[]'::jsonb
          )
          returning id as mount_import_id \gset

          select public.catalogue_accept_spec_evidence_from_import(
            :frame_size_import_id,
            'ci-reviewer',
            'Accept frame-size evidence'
          );

          select id as frame_size_evidence_id
          from public.catalogue_spec_evidence
          where product_id = 'workflow-frame'
            and field_key = 'frameInches'
            and source_url = 'https://example.com/manufacturer/wf5'
          limit 1 \gset

          select public.catalogue_verify_spec_evidence(
            :'frame_size_evidence_id',
            'ci-reviewer',
            'Verify frame-size evidence'
          );

          do $test$
          begin
            begin
              perform public.catalogue_complete_technical_review(
                'workflow-frame',
                'ci-reviewer',
                'Must still fail because mount evidence is missing'
              );

              raise exception 'EARLY_TECHNICAL_REVIEW_SUCCEEDED';
            exception
              when others then
                if sqlerrm = 'EARLY_TECHNICAL_REVIEW_SUCCEEDED' then
                  raise;
                end if;
            end;
          end;
          $test$;

          select public.catalogue_accept_spec_evidence_from_import(
            :mount_import_id,
            'ci-reviewer',
            'Accept motor-mount evidence'
          );

          select id as mount_evidence_id
          from public.catalogue_spec_evidence
          where product_id = 'workflow-frame'
            and field_key = 'mount'
            and source_url = 'https://example.com/manufacturer/wf5'
          limit 1 \gset

          select public.catalogue_verify_spec_evidence(
            :'mount_evidence_id',
            'ci-reviewer',
            'Verify motor-mount evidence'
          );

          select public.catalogue_complete_technical_review(
            'workflow-frame',
            'ci-reviewer',
            'All required frame fields are source-backed'
          );

          select public.catalogue_add_verified_eu_offer(
            'workflow-frame',
            'Workflow EU Merchant',
            'https://example.com/shop/wf5',
            79.95,
            'in_stock',
            now(),
            'ci-reviewer',
            'Verified EU/EUR test offer',
            'DE'
          );

          do $test$
          begin
            if cardinality(public.catalogue_publication_blockers('workflow-frame')) <> 0 then
              raise exception 'Product still has publication blockers after complete review.';
            end if;
          end;
          $test$;

          select public.catalogue_publish_product(
            'workflow-frame',
            'ci-reviewer',
            'Publication gate passed'
          );

          do $test$
          declare
            runtime_price numeric;
            runtime_currency text;
            runtime_region text;
            event_count integer;
          begin
            select price_amount, currency, offer_region
            into runtime_price, runtime_currency, runtime_region
            from public.catalogue_runtime_products
            where id = 'workflow-frame';

            if runtime_price <> 79.95
               or runtime_currency <> 'EUR'
               or runtime_region <> 'EU' then
              raise exception 'Published product is missing its reviewed EU/EUR runtime offer.';
            end if;

            select count(*) into event_count
            from public.catalogue_promotion_events
            where product_id = 'workflow-frame';

            if event_count <> 10 then
              raise exception 'Expected 10 promotion events before unpublish, got %', event_count;
            end if;

            if not exists (
              select 1
              from public.catalogue_product_quality_reviews
              where product_id = 'workflow-frame'
                and identity_quality_status = 'verified'
                and technical_quality_status = 'verified'
                and human_review_required = false
                and price_status = 'market_offer_backed'
            ) then
              raise exception 'Quality review was not fully promoted.';
            end if;
          end;
          $test$;

          select public.catalogue_unpublish_product(
            'workflow-frame',
            'ci-reviewer',
            'Verify reversible publication'
          );

          do $test$
          begin
            if exists (
              select 1
              from public.catalogue_runtime_products
              where id = 'workflow-frame'
            ) then
              raise exception 'Unpublished product still appears in runtime view.';
            end if;

            if (
              select count(*)
              from public.catalogue_promotion_events
              where product_id = 'workflow-frame'
            ) <> 11 then
              raise exception 'Unpublish event was not recorded.';
            end if;
          end;
          $test$;
          SQL

      - name: Route smoke test
        run: |
          bun run dev --host 0.0.0.0 > /tmp/dronecores-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/create-custom-build >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=template&template=racer" >/dev/null
          curl -fsS "http://127.0.0.1:8080/create-custom-build?source=ai&budget=1200&priorities=footage,range" >/dev/null
          curl -fsS http://127.0.0.1:8080/templates >/dev/null
          curl -fsS http://127.0.0.1:8080/ai-build >/dev/null

      - name: Commit targeted formatting
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalogue-promotion.server.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format catalogue promotion server [skip ci]"
            git push origin HEAD:feature/shared-drone-configurator
          fi
